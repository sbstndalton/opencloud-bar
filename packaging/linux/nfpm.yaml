# Linux .deb and .rpm. Fill in the variables, then package (run from the repo root):
#   VERSION=1.2.3 ARCH=amd64 SRC=/abs/folder envsubst < packaging/linux/nfpm.yaml > /tmp/nfpm.yaml
#   nfpm package -p deb -f /tmp/nfpm.yaml
name: opencloud-bar
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: OpenCloud Bar contributors <noreply@github.com>
description: |
  Tray app and service for OpenCloud: an on-demand drive (rclone mount) plus
  folders kept in two-way sync (rclone bisync), signed in through the browser. Includes rclone.
homepage: https://github.com/sbstndalton/opencloud-bar
license: MIT
depends:
  - fuse3
recommends:
  - zenity
overrides:
  deb:
    recommends: [zenity, libnotify-bin, openssh-client]   # notify-send; ssh only for legacy SSH-tunnel configs
  rpm:
    recommends: [zenity, libnotify, openssh-clients]
contents:
  - src: ${SRC}/opencloud-bar
    dst: /usr/bin/opencloud-bar
    file_info: {mode: 0755}
  - src: ${SRC}/rclone
    dst: /usr/lib/opencloud-bar/rclone
    file_info: {mode: 0755}
  - src: ${SRC}/LICENSE
    dst: /usr/share/doc/opencloud-bar/LICENSE
  - src: ${SRC}/rclone-LICENSE.txt
    dst: /usr/share/doc/opencloud-bar/rclone-LICENSE.txt
  - src: packaging/linux/opencloud-bar.desktop
    dst: /usr/share/applications/opencloud-bar.desktop
  - src: packaging/linux/opencloud-bar.service
    dst: /usr/lib/systemd/user/opencloud-bar.service
  - src: packaging/icon/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/opencloud-bar.png
  - src: packaging/icon/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/opencloud-bar.png
  - src: packaging/icon/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/opencloud-bar.svg
