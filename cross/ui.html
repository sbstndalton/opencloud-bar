<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCloud Bar</title>
<style nonce="{{NONCE}}">
:root { color-scheme: light dark; --bg:#f6f7f9; --panel:#fff; --text:#1c1e21; --muted:#6a7077; --line:#dcdfe4; --accent:#2f6fed; --ok:#2e9d57; --warn:#d98a00; --bad:#d23b3b; }
@media (prefers-color-scheme: dark) { :root { --bg:#17181b; --panel:#212328; --text:#e8eaed; --muted:#9aa1a9; --line:#363a41; --accent:#6b9bff; --ok:#4cc27a; --warn:#f0a93a; --bad:#ff6b6b; } }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
.app { display:flex; min-height:100vh; }
nav { width:190px; padding:16px 10px; border-right:1px solid var(--line); background:var(--panel); flex:none; }
nav h1 { font-size:15px; margin:0 8px 14px; }
nav button { display:block; width:100%; text-align:left; border:0; background:none; color:var(--text); padding:8px 10px; border-radius:6px; font:inherit; cursor:pointer; }
nav button:hover { background:var(--bg); }
nav button.on { background:var(--accent); color:#fff; }
main { flex:1; padding:20px 28px 60px; max-width:980px; min-width:0; }
h2 { margin:0 0 4px; font-size:20px; }
h3 { margin:22px 0 8px; font-size:14px; }
.summary { color:var(--muted); margin:0 0 18px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:12px 0; }
.row { display:flex; gap:12px; align-items:center; margin:8px 0; flex-wrap:wrap; }
.row > label { width:210px; flex:none; }
.check, .row > label.check { display:flex; gap:6px; align-items:center; margin:4px 0; width:auto; }
.hint { color:var(--muted); font-size:12.5px; margin:2px 0; }
input[type=text], input[type=password], input[type=search], input[type=number], select, textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:0; }
input[type=text], input[type=password], input[type=search] { width:320px; max-width:100%; }
input[type=number] { width:110px; }
textarea { width:100%; min-height:150px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; }
button.btn { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
button.btn:hover:not(:disabled) { border-color:var(--accent); }
button.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.btn.danger { color:var(--bad); }
button.btn:disabled { opacity:.45; cursor:default; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; }
tr.sel { background:color-mix(in srgb, var(--accent) 12%, transparent); }
tbody tr { cursor:pointer; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--muted); }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
.dot.busy { background:none; border:2px solid var(--accent); border-right-color:transparent; width:11px; height:11px; vertical-align:-1px; animation:spin .9s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation:none; background:var(--accent); border:0; width:9px; height:9px; } }
.about { display:flex; gap:18px; align-items:center; }
.about img { width:72px; height:72px; }
.path { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; word-break:break-all; }
.bar { height:12px; background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:hidden; max-width:420px; }
.bar > div { height:100%; background:var(--ok); }
.bar.nearing > div { background:var(--warn); } .bar.critical > div, .bar.exceeded > div { background:var(--bad); }
pre.log { background:#101114; color:#d7dae0; padding:12px; border-radius:8px; height:60vh; overflow:auto; font:12px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space:pre-wrap; word-break:break-all; margin:8px 0; }
pre.log .err { color:#ff8b8b; } pre.log .warn { color:#f0c36a; }
#toast { position:fixed; right:18px; bottom:18px; max-width:420px; padding:10px 14px; border-radius:8px; background:var(--panel); border:1px solid var(--line); box-shadow:0 4px 18px rgba(0,0,0,.2); display:none; }
#toast.bad { border-color:var(--bad); color:var(--bad); }
#banner { display:none; background:var(--bad); color:#fff; padding:10px 28px; }
details { margin:14px 0; } summary { cursor:pointer; font-weight:600; }
.inline-err { color:var(--bad); }
.notice { display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:color-mix(in srgb, var(--accent) 10%, var(--panel)); border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius:8px; padding:10px 14px; margin:0 0 14px; }
.notice.paused { background:color-mix(in srgb, var(--warn) 10%, var(--panel)); border-color:color-mix(in srgb, var(--warn) 45%, var(--line)); }
.notice span { flex:1; min-width:200px; }
td .why { display:block; color:var(--muted); font-size:12.5px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
tbody tr:focus-visible { outline-offset:-2px; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
@media (max-width: 640px) { .app { flex-direction:column; } nav { width:auto; display:flex; flex-wrap:wrap; gap:4px; border-right:0; border-bottom:1px solid var(--line); } nav h1 { width:100%; } nav button { width:auto; } .row > label { width:100%; } }
</style>
</head>
<body>
<div id="banner" role="alert"></div>
<div class="app">
  <nav id="nav" aria-label="Settings sections"><h1>OpenCloud Bar</h1></nav>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script nonce="{{NONCE}}">
"use strict";
// Plain DOM code, no libraries. Text from the server is only ever set with textContent.
const SECTIONS = [["folders","Folders"],["search","Search"],["activity","Activity"],["conflicts","Conflicts"],["trash","Deleted Files"],["account","Account"],["sync","Sync"],["drive","Drive"],["general","General"],["logs","Logs"],["about","About"]];
let S = null;            // last /ui/api/state
let section = "folders";
let selected = null;     // selected folder path
let timers = [];
let render = 0;          // bumps on every section render so stale async results are dropped

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

// Accessibility: every control gets a name. A label in the same row is tied to its control
// (<label for>); a control without one is named from its placeholder or the heading above it.
// Runs on everything the page adds, so the section code stays plain.
let a11yId = 0;
function a11yFix(root) {
  if (!root.querySelectorAll) return;
  for (const lab of root.querySelectorAll(".row > label:not([for]):not(.check)")) {
    const c = lab.nextElementSibling;
    if (c && /^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName)) {
      if (!c.id) c.id = "c" + (++a11yId);
      lab.htmlFor = c.id;
    }

    if (c.labels && c.labels.length) continue;

// The 3-second refresh redraws parts of the page; keep the keyboard focus on the same control.

  .observe(document.body, { childList: true, subtree: true });
async function api(method, path, body) {

  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  let resp;
  try { resp = await fetch("/ui/api/" + path, opt); } catch (e) { throw new Error("OpenCloud Bar isn't answering. Is it still running?"); }
  let data = {};
  try { data = await resp.json(); } catch (e) { /* empty */ }
  if (resp.status === 401) { banner("This page's sign-in ended. Choose Settings… in the OpenCloud Bar menu to open it again."); throw new Error("not signed in"); }

const get = (p) => api("GET", p);
const post = (p, b) => api("POST", p, b === undefined ? {} : b);

function banner(msg) { const b = document.getElementById("banner"); b.textContent = msg; b.style.display = "block"; }
let toastTimer;

  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, bad ? 9000 : 2500);
}
async function act(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message, true); }
  await refreshState();
}

// Settings save: build a patch, send it, show the server's validation message if it refuses.
async function save(patch, then) {
  try {
    const r = await post("config", patch);
    if (r.pending) toast("Saved. It applies when the running sync finishes.");
    else if (r.restartRequired) toast("Saved. Restart OpenCloud Bar for the new port to take effect.");
    else toast("Saved");
  } catch (e) {
    toast(e.message, true);
  }

  if (then) then();

const debounced = {};
function saveSoon(key, patch) { clearTimeout(debounced[key]); debounced[key] = setTimeout(() => save(patch), 700); }

function fmtBytes(n) {
  if (n == null) return "";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];

function ago(iso) {
  const t = Date.parse(iso);
  if (!iso || isNaN(t) || t < 86400000) return "not yet";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  if (m < 48 * 60) return Math.round(m / 60) + " h ago";
  return Math.round(m / 1440) + " days ago";
}
// deletionPrompt explains a blocked large deletion, naming the side it happened on.
function deletionPrompt(side) {
  const where = side === "on this computer" ? "on this computer" : side === "in OpenCloud" ? "in OpenCloud" : "on one side";
  const other = side === "on this computer" ? "OpenCloud" : side === "in OpenCloud" ? "this computer" : "the other side";
  return "More than half of this folder's files were deleted " + where + ". If that was on purpose, the deletion will be applied to " + other + " too.";

// triggerText: what started the sync that made a change.
function triggerText(t) {
  return t === "local change" ? "Change on this computer" : t === "server change" ? "Change in OpenCloud" : t === "timer" ? "Interval" : "";
}
// stateLook: dot colour, short status, and (for problems) why, in plain words.
function stateLook(f) {

  const quiet = f.state === "ok" || f.state === "idle" || f.state === "skipped" || !f.state;
  if (f.pending && quiet && !(S.status && S.status.paused)) return ["busy", "Change detected, syncing soon", ""];
  switch (f.state) {
    case "syncing": return ["busy", "Syncing…", ""];
    case "ok": return ["ok", "Up to date", f.detail || ""];
    case "skipped": return ["warn", "Skipped", f.detail || ""];
    case "failed": return ["bad", "Sync failed", f.detail || ""];
    case "needs-repair": return ["bad", "Needs repair", f.detail || ""];
    case "large-deletion": return ["warn", "Large deletion blocked", "More than half of the files were deleted " + (f.detail || "on one side") + ". Check, then allow it or restore the files."];

// ---- shell

function buildNav() {
  const nav = document.getElementById("nav");
  nav.replaceChildren(h("h1", { text: "OpenCloud Bar" }));
  for (const [id, label] of SECTIONS) {
    nav.append(h("button", { class: id === section ? "on" : "", "aria-current": id === section ? "page" : null, onclick: () => go(id, true) }, label));
  }
}
function go(id, focus) {
  section = id; location.hash = id;
  timers.forEach(clearInterval); timers = [];
  render++;
  buildNav();
  const main = document.getElementById("main");
  main.replaceChildren();
  ({ folders, search, activity, conflicts, trash, account, sync: syncPage, drive, general, logs, about })[id](main, render);
  // A section chosen in the list: move the keyboard focus to its heading.
  const h2 = focus && main.querySelector("h2");
  if (h2) { h2.tabIndex = -1; h2.focus(); }
}
async function refreshState() {
  try { S = await get("state"); } catch (e) { return; }
  const sum = document.getElementById("summary");
  if (sum) sum.textContent = S.status.summary + (S.status.message ? " — " + S.status.message : "");
  drawNotices();
  if (section === "folders") drawFolders();
  if (section === "conflicts") drawConflicts();
  if (section === "drive") drawDriveButtons();
}
function header(main, title) {
  main.append(h("h2", { text: title }), h("p", { class: "summary", id: "summary", role: "status", "aria-live": "polite", text: S ? S.status.summary : "" }), h("div", { id: "notices" }));
  drawNotices();
}
// Paused and update-available notices, at the top of every section.
function drawNotices() {
  const box = document.getElementById("notices");
  if (!box || !S) return;
  const out = [];
  if (S.status.paused) out.push(h("div", { class: "notice paused" },
    h("span", { text: S.status.pausedUntil && pauseClock(S.status.pausedUntil)
      ? "Paused until " + pauseClock(S.status.pausedUntil) + ". Kept folders don't sync until then or until you resume; the drive keeps working."
      : "Syncing is paused. Kept folders don't sync until you resume; the drive keeps working." }),
    h("button", { class: "btn primary", onclick: () => setPaused(false) }, "Resume Syncing")));
  const u = S.status.update;
  if (u && u.available) out.push(h("div", { class: "notice" },
    h("span", { text: "OpenCloud Bar " + u.latest + " is available (you have " + u.running + ")." }),
    h("button", { class: "btn primary", onclick: () => act(() => post("open", { kind: "release" })) }, "Open Release Page")));
  const q = S.status.storage;
  if (q && q.total > 0 && q.used >= 0.9 * q.total) out.push(h("div", { class: "notice" },
    h("span", { text: (q.used >= q.total ? "Your OpenCloud storage is full: " : "Your OpenCloud storage is almost full: ") + fmtBytes(q.used) + " of " + fmtBytes(q.total) + " used." + (q.used >= q.total ? " New files and changes can't be uploaded until you free up space." : "") }),
    h("button", { class: "btn", onclick: () => go("account", true) }, "Account")));

}
function setPaused(p) {
  return act(() => post("pause", { paused: p }), p ? "Syncing paused" : "Syncing resumed");
}
// When a sync runs, an action that needs the folders to itself waits for it.
const waits = (msg) => (S && S.status.syncing ? "Waits for the running sync" : msg);
// "14:30" for today, "Wed 08:00" for another day: when a timed pause ends.
function pauseClock(iso) {
  const t = new Date(iso), now = new Date();
  if (isNaN(t)) return "";
  const hm = t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  return t.toDateString() === now.toDateString() ? hm : t.toLocaleDateString([], { weekday: "short" }) + " " + hm;
}

// ---- Folders

function folders(main) {
  header(main, "Folders");
  main.append(h("div", { id: "folders-body" }));
  drawFolders();
  timers.push(setInterval(refreshState, 3000));
}
function drawFolders() {

  const list = S.folders;

    h("button", { class: "btn primary", disabled: !S.config.configured || S.status.signedOut, onclick: keepFolder }, "Keep a Folder…"),
    h("button", { class: "btn", disabled: busy || !S.config.configured || S.status.paused, onclick: () => act(() => post("sync"), "Sync started") }, "Sync Now"),
    h("button", { class: "btn", disabled: !S.config.configured, onclick: () => setPaused(!S.status.paused) }, S.status.paused ? "Resume Syncing" : "Pause Syncing"),
    h("button", { class: "btn", disabled: !S.config.serverURL, onclick: () => act(() => post("open", { kind: "web" })) }, "Open OpenCloud in Browser"));
  const tbl = h("table", { "aria-label": "Kept folders" }, h("thead", {}, h("tr", {}, h("th", { text: "Name" }), h("th", { text: "On this computer" }), h("th", { text: "Status" }), h("th", { text: "Last synced" }))),
    h("tbody", {}, list.map(f => {
      const [cls, text, why] = stateLook(f);
      const pick = () => { selected = f.path; drawFolders(); const r = document.querySelector("tbody tr.sel"); if (r) r.focus(); };
      return h("tr", { class: f.path === selected ? "sel" : "", tabindex: "0", "data-path": f.path, "aria-selected": f.path === selected ? "true" : "false",

        h("td", {}, f.name, f.space ? h("span", { class: "why", text: "in " + f.space }) : null), h("td", { class: "path", text: f.local }),

  parts.push(list.length ? tbl : h("div", { class: "card" }, "Nothing is kept on this computer yet. Choose Keep a Folder… to start."));
  const f = list.find(x => x.path === selected);
  if (f) parts.push(folderDetail(f));
  parts.push(keepBox(busy));

  const keepText = old && old.dataset.path === selected ? old.value : null;
  const taFocus = old && document.activeElement === old;
  const typed = body.querySelector("#keep-path"), typedVal = typed ? typed.value : "";
  const wasOpen = !!(body.querySelector("details.keep") || {}).open;

  const ta = body.querySelector("textarea");
  if (ta && keepText != null) { ta.value = keepText; if (taFocus) ta.focus(); }

function keepFolder() {
  act(() => post("keep", {}), "Choose the folder in the dialog on your desktop");
}
function folderDetail(f) {

  ta.value = f.extraFilters.join("\n");
  const acts = [
    h("button", { class: "btn", onclick: () => act(() => post("open", { kind: "folder", path: f.path })) }, "Open Folder"),
    h("button", { class: "btn", disabled: !S.config.configured || S.status.paused || f.state === "syncing" || !!f.queued,
      onclick: () => act(() => post("sync", { path: f.path }), "Sync started") }, "Sync Now")];
  if (f.state === "needs-repair") acts.push(h("button", { class: "btn", onclick: () => {
    if (confirm("Repair " + f.name + "?\n\nThis merges this computer's copy with OpenCloud. For each file the newer copy wins; the older copies are kept in the backups (.opencloud-bar-backups in OpenCloud, and on this computer). Files deleted since the last good sync will come back.")) act(() => post("repair", { path: f.path }), waits("Repair started"));

  } }, "Allow Large Deletion…"));

    h("h3", { text: f.name }),
    h("div", { class: "row" }, h("label", { text: "On this computer" }), h("span", { class: "path", text: f.local })),
    h("div", { class: "row" }, h("label", { text: "In OpenCloud" }), h("span", { class: "path", text: "/" + f.remote })),
    h("div", { class: "row" }, h("label", { text: "Status" }), h("span", { text: stateLook(f)[1] + (stateLook(f)[2] ? ": " + stateLook(f)[2] : "") })),
    h("div", { class: "row" }, h("label", { text: "Last synced" }), h("span", { text: ago(f.lastSuccess) })),
    h("div", { class: "row" }, acts),
    h("h3", { text: "Excludes for this folder only" }),

        h("button", { class: "btn danger", "aria-label": "Discard " + c.file, onclick: () => { if (confirm("Discard " + c.file + "?\n\nIt moves to " + trashWhere() + ". The next sync removes it from OpenCloud too.")) conflictAct(f, c, "discard", "Discarded"); } }, "Discard")))))),

// ---- Deleted Files (OpenCloud's trash)

let trashAll = false;
async function trash(main, r) {
  header(main, "Deleted Files");
  main.append(h("p", { class: "hint", text: "Files and folders deleted in OpenCloud, from your personal space and the spaces you keep folders from, newest first. Restore puts an item back where it was, if that was in a kept folder; the folder then syncs (while syncing is paused, when you resume). If something is at that place again, nothing is restored or overwritten. Deleting for good is done in OpenCloud in the browser." }));
  const all = h("input", { type: "checkbox", id: "trash-all" }); all.checked = trashAll;
  const body = h("div", { id: "trash-body" }, h("p", { class: "hint", text: "Loading…" }));
  main.append(h("div", { class: "row" }, h("label", { class: "check" }, all, h("span", { text: "Show all (also items that weren't in a kept folder)" })),
    h("button", { class: "btn", onclick: () => load() }, "Reload")), body);
  const load = async () => {
    let l;
    try { l = await get("trash" + (trashAll ? "?all=1" : "")); } catch (e) { if (r === render) body.replaceChildren(h("div", { class: "card" }, e.message)); return; }
    if (r !== render) return;
    const parts = [];
    for (const p of l.problems || []) parts.push(h("p", { class: "hint", text: "Couldn't read the trash of " + p }));
    if (!l.items.length) parts.push(h("div", { class: "card" }, l.hidden ? "Nothing deleted from your kept folders. " + l.hidden + " other item(s) are in the trash; choose Show all to see them." : "The trash is empty."));
    else parts.push(h("table", { "aria-label": "Deleted files" },
      h("thead", {}, h("tr", {}, h("th", { text: "Name" }), h("th", { text: "Was in" }), h("th", { text: "Deleted" }), h("th", { text: "Size" }), h("th", { text: "" }))),
      h("tbody", {}, l.items.map(it => h("tr", {},
        h("td", { text: it.name + (it.dir ? "/" : "") }),
        h("td", { class: "path", text: (it.spaceName === "Personal" ? "" : it.spaceName + ": ") + "/" + it.path }),
        h("td", { text: it.deleted && Date.parse(it.deleted) > 86400000 ? new Date(it.deleted).toLocaleString() : "" }),
        h("td", { text: it.size >= 0 ? fmtBytes(it.size) : "" }),
        h("td", {}, it.folder ? h("button", { class: "btn", "aria-label": "Restore " + it.path, onclick: async (ev) => {
          if (!confirm("Restore " + it.path + " to where it was?\n\n" + (S.status.paused ? "It comes to this computer when you resume syncing." : "The folder then syncs it to this computer."))) return;
          ev.currentTarget.disabled = true;
          await act(() => post("restore-trash", { space: it.spaceId, key: it.key }), restoredToast());
          load();
        } }, "Restore") : h("span", { class: "hint", text: "Not in a kept folder: restore it in the browser" })))))));
    if (l.hidden && l.items.length) parts.push(h("p", { class: "hint", text: l.hidden + " item(s) that weren't in a kept folder are hidden; choose Show all to see them." }));
    keepFocus(body, () => body.replaceChildren(...parts));
  };
  all.addEventListener("change", () => { trashAll = all.checked; load(); });
  await load();
}

// ---- Account

async function account(main, r) {
  header(main, "Account");
  const box = h("div", {}, "Loading…");
  main.append(box);
  let a;
  try { a = await get("account"); } catch (e) { box.textContent = e.message; box.className = "inline-err"; return; }
  if (r !== render) return;
  const row = (k, v) => v ? h("div", { class: "row" }, h("label", { text: k }), h("span", { text: v })) : null;
  const card = h("div", { class: "card" },
    row("Server", a.server), row("Name", a.displayName), row("Email", a.email), row("Username", a.username), row("Server version", a.version),
    a.note ? h("p", { class: "hint", text: a.note }) : null);
  if (a.quota && a.quota.total > 0) {
    const pct = Math.min(100, Math.round(100 * a.quota.used / a.quota.total));
    const fill = h("div", {}); fill.style.width = pct + "%";
    card.append(h("div", { class: "row" }, h("label", { text: "Storage" }),
      h("div", {}, h("div", { class: "bar " + (a.quota.state || "normal") }, fill),
        h("div", { class: "hint", text: fmtBytes(a.quota.used) + " of " + fmtBytes(a.quota.total) + " used (" + pct + "%)" + (a.quota.state && a.quota.state !== "normal" ? " — " + a.quota.state : "") }))));
  } else if (a.quota) {
    card.append(row("Storage", fmtBytes(a.quota.used) + " used (no limit)"));
  }
  for (const e of a.errors || []) card.append(h("p", { class: "inline-err", text: e }));
  const btns = h("div", { class: "row" },
    h("button", { class: "btn", disabled: !a.server || a.mode === "none", onclick: () => act(() => post("open", { kind: "web" })) }, "Open OpenCloud in Browser"),
    h("button", { class: "btn", onclick: () => go("account") }, "Refresh"));
  if (a.mode === "none" || a.signedOut) {
    // Typing the address here needs no dialog (Linux without zenity).
    const addr = h("input", { type: "text", placeholder: "https://cloud.example.com", value: a.server || "" });
    card.append(h("div", { class: "row" }, h("label", { text: "Server address" }), addr));
    btns.append(h("button", { class: "btn primary", onclick: () => {
      const v = addr.value.trim();
      if (!v) { toast("Type your server address first", true); return; }
      act(() => post("setup", { serverURL: v }), "Continue signing in in your browser");
    } }, "Sign In"));
  }
  else if (a.mode === "oidc") btns.append(h("button", { class: "btn danger", onclick: signOut }, "Sign Out"));
  card.append(btns);
  box.replaceWith(card);
}

// Sign out, but ask again (fail closed) while files written to the drive may still be uploading.
async function signOut() {
  if (!confirm("Sign out of OpenCloud?\n\nThe drive is disconnected and syncing stops. Your kept folders stay on this computer. Sign in again to resume.")) return;
  try {
    await post("signout", { force: false });
  } catch (e) {
    if (!e.data || !e.data.uploads) { toast(e.message, true); return; }
    if (!confirm("Sign out anyway?\n\n" + e.message + ". They upload after you sign in again.")) return;
    try { await post("signout", { force: true }); } catch (e2) { toast(e2.message, true); return; }
  }
  toast("Signed out");
  await refreshState();
  go("account");
}

// ---- field helpers for the settings pages

function textField(label, key, hint, opts) {
  opts = opts || {};
  const inp = h("input", { type: "text", value: S.config[key] || "", placeholder: opts.placeholder || "", disabled: !!opts.disabled });
  inp.addEventListener("input", () => saveSoon(key, { [key]: inp.value }));
  return h("div", { class: "row" }, h("label", { text: label }), inp, hint ? h("span", { class: "hint", text: hint }) : null);
}
function numField(label, key, hint, min, max) {
  const inp = h("input", { type: "number", value: S.config[key], min, max });
  inp.addEventListener("input", () => { if (inp.value !== "") saveSoon(key, { [key]: parseInt(inp.value, 10) }); });
  return h("div", { class: "row" }, h("label", { text: label }), inp, hint ? h("span", { class: "hint", text: hint }) : null);
}
function selectField(label, key, options, hint) {
  const sel = h("select", {});
  const cur = String(S.config[key]);
  const opts = options.some(o => String(o[0]) === cur) ? options : options.concat([[S.config[key], String(S.config[key])]]);
  for (const [v, t] of opts) { const o = h("option", { value: String(v), text: t }); if (String(v) === cur) o.selected = true; sel.append(o); }
  sel.addEventListener("change", () => save({ [key]: typeof S.config[key] === "number" ? parseInt(sel.value, 10) : sel.value }));
  return h("div", { class: "row" }, h("label", { text: label }), sel, hint ? h("span", { class: "hint", text: hint }) : null);
}
function checkField(label, key, hint) {
  const cb = h("input", { type: "checkbox" }); cb.checked = !!S.config[key];
  cb.addEventListener("change", () => save({ [key]: cb.checked }));
  return h("div", { class: "row" }, h("label", { text: label }), cb, hint ? h("span", { class: "hint", text: hint }) : null);
}

async function syncPage(main, r) {

  pausedBox.addEventListener("change", () => setPaused(pausedBox.checked));
  main.append(h("div", { class: "card" },
    h("div", { class: "row" }, h("label", { text: "Pause syncing" }), pausedBox,
      h("span", { class: "hint", text: "Kept folders stop syncing until you resume. The drive keeps working." })),
    checkField("Sync changes right away", "liveSync", "A kept folder syncs about 5 seconds after changes in it on this computer stop (up to a minute while changes continue, and at least 30 seconds after its last such sync), and within about 30 seconds of a change in it in OpenCloud (with the browser sign-in). The interval is then a safety net, every 15 minutes or your interval if longer. Large folders sync after changes at most every 10 minutes."),
    selectField("Sync every", "syncIntervalSeconds", [[60,"1 minute"],[300,"5 minutes"],[900,"15 minutes"],[1800,"30 minutes"],[3600,"1 hour"]]),
    selectField("Folders synced at once", "syncParallel", [[1,"1"],[2,"2"],[3,"3"],[4,"4"]], "Folders with a change sync first. A folder whose sync takes more than half the interval syncs less often on the interval (changes still sync it)."),

    numField("Parallel transfers", "transfers", "How many files copy at once (1 to 32).", 1, 32),
    numField("Parallel checks", "checkers", "How many files are compared at once (1 to 64).", 1, 64),
    textField("Upload limit", "bwLimitUp", "For syncs and the drive, like 512K (KiB/s) or 2M (MiB/s). Empty: no limit.", { placeholder: "no limit" }),
    textField("Download limit", "bwLimitDown", "Like 512K or 10M. Empty: no limit.", { placeholder: "no limit" })));
  const ta = h("textarea", { spellcheck: "false", "aria-label": "Common excludes" }); ta.value = S.config.commonFilters.join("\n");
  main.append(h("div", { class: "card" }, h("h3", { text: "Common excludes" }),
    h("p", { class: "hint", text: "Files matching these rules are never synced, in any kept folder. One rule per line, like - *.tmp (exclude) or + keep.txt (include)." }),
    ta, h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => { if (confirm(filtersChangeText("every kept folder").replace("every kept folder syncs", "Every kept folder syncs"))) save({ commonFilters: ta.value.split("\n") }); } }, "Save Excludes"),
      h("button", { class: "btn", onclick: () => { ta.value = S.defaults.commonFilters.join("\n"); save({ commonFilters: S.defaults.commonFilters }); } }, "Restore Defaults"))));
  const blocked = h("div", { class: "card" }, h("h3", { text: "File names the server doesn't accept" }), h("p", { class: "hint", text: "Loading…" }));
  main.append(blocked);
  try {
    const a = await get("account");
    if (r !== render) return;
    blocked.replaceChildren(h("h3", { text: "File names the server doesn't accept" }),

      h("p", { class: "hint", text: "Read-only; set by the server's administrator." }));
  } catch (e) { blocked.replaceChildren(h("p", { class: "inline-err", text: e.message })); }

function drive(main, r) {

    const isWin = navigator.userAgent.includes("Windows");
    main.append(h("div", { class: "card" },
      checkField("Show the OpenCloud drive", "mountEnabled", "Mounts your OpenCloud files as a drive that downloads files when you open them."),

      isWin ? textField("Volume name", "volumeName") : null, // rclone --volname only works on Windows and macOS
      selectField("Cache size limit", "cacheMaxSize", [["5G","5 GB"],["10G","10 GB"],["20G","20 GB"],["50G","50 GB"],["100G","100 GB"]]),
      selectField("Keep cached files for", "cacheMaxAge", [["24h","24 hours"],["72h","3 days"],["168h","7 days"]])));

function drawDriveButtons() {
  const box = document.getElementById("drive-live"); if (!box) return;

  const btns = h("div", { class: "row" },
    st.driveMounted ? h("button", { class: "btn", onclick: () => act(() => post("eject"), "Drive ejected") }, "Eject Drive")
      : h("button", { class: "btn primary", disabled: !S.config.mountEnabled || st.driveWanted, onclick: () => act(() => post("connect")) }, st.driveWanted ? "Connecting…" : "Connect Drive"),
    h("button", { class: "btn", disabled: !S.config.mountEnabled, onclick: () => act(() => post("open", { kind: "drive" })) }, "Open Drive Folder"));
  keepFocus(box, () => box.replaceChildren(h("h3", { text: st.driveMounted ? "Drive is connected" : "Drive is not connected" }), live || h("div", { id: "drive-stats" }), btns));
}
async function pollDrive(r) {
  let d;

  if (r !== render || !el) return;

  if (d.error) { el.replaceChildren(h("p", { class: "hint", text: d.error })); return; }
  el.replaceChildren(h("div", { class: "row" }, h("label", { text: "Cache in use" }), h("span", { text: fmtBytes(d.cacheBytes) })),
    h("div", { class: "row" }, h("label", { text: "Uploading" }), h("span", { text: d.uploadsInProgress + " file(s)" })),
    h("div", { class: "row" }, h("label", { text: "Waiting to upload" }), h("span", { text: d.uploadsQueued + " file(s)" })));
}

// ---- General

function general(main, r) {
  header(main, "General");
  refreshState().then(() => {
    if (r !== render) return;
    const c = S.config;
    const u = S.status.update || {};
    const upLine = h("p", { class: "hint", id: "update-line", text: updateText(u) });
    main.append(h("div", { class: "card" }, h("h3", { text: "OpenCloud Bar" }),
      h("div", { class: "row" }, h("label", { text: "Version" }), h("span", { text: S.version })),
      checkField("Check for updates automatically", "checkForUpdates", "Once a day, from GitHub. Nothing about you is sent."),
      checkField("Show notifications", "notifications", "When a folder needs attention, is merged automatically, or an update is available. Once per change, not repeated."),
      upLine,
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: async (ev) => {
          ev.target.disabled = true; upLine.textContent = "Checking…";
          try { const r = await post("check-updates"); upLine.textContent = updateText(r); if (r.error) toast(r.error, true); }
          catch (e) { upLine.textContent = e.message; }
          ev.target.disabled = false; await refreshState();
        } }, "Check for Updates"),
        u.available ? h("button", { class: "btn primary", onclick: () => act(() => post("open", { kind: "release" })) }, "Open Release Page") : null)));
    if (c.useTunnel) main.append(h("div", { class: "card" }, numField("Keep this much server memory free (MiB)", "minServerAvailableMiB", "Sync is skipped when the server has less memory available. 0 turns the check off.", 0, 4194304)));
    main.append(h("div", { class: "card" }, h("h3", { text: "Settings file" }),
      h("p", { class: "hint", text: "Everything here is saved to a settings file. You never need to edit it by hand." }),
      h("div", { class: "path", text: S.configFile }),
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => act(() => post("reload"), "Settings reloaded") }, "Reload Settings"),
        h("button", { class: "btn", onclick: () => act(() => post("open", { kind: "config" })) }, "Open Settings File"))));
    const adv = h("details", {}, h("summary", { text: "Advanced" }),
      h("div", { class: "card" },
        h("h3", { text: "SSH tunnel" }),
        h("p", { class: "hint", text: "Only for servers reached through an SSH tunnel. Most people leave this off." }),
        checkField("Use an SSH tunnel", "useTunnel"),
        textField("SSH host", "sshHost", "As in your ssh config, for example myserver."),
        numField("Server port", "serverPort", "OpenCloud's port on the server.", 1, 65535),
        numField("Local port", "localPort", "Needs a restart of OpenCloud Bar.", 1024, 65000),
        h("h3", { text: "rclone" }),
        textField("rclone path", "rclonePath", "Leave empty to use the rclone that comes with the app.")));
    main.append(adv);

function updateText(u) {
  if (!u || !u.running) return "";
  if (u.error) return "Last check failed: " + u.error;
  if (!u.checkedAt || Date.parse(u.checkedAt) < 86400000) return "Not checked yet.";
  const when = "Checked " + ago(u.checkedAt) + ". ";
  if (u.available) return when + "Version " + u.latest + " is available.";
  if (u.devBuild) return when + "This is a development build; the latest release is " + (u.latest || "unknown") + ".";
  return when + "You have the latest version.";
}

// ---- Logs

let logName = "app.log";
async function logs(main, r) {
  header(main, "Logs");
  let src;
  try { src = await get("logs"); } catch (e) { main.append(h("p", { class: "inline-err", text: e.message })); return; }
  if (r !== render) return;
  if (!src.some(s => s.name === logName)) logName = "app.log";
  const sel = h("select", { "aria-label": "Log", onchange: () => { logName = sel.value; stick = true; load(); } },
    src.map(s => { const o = h("option", { value: s.name, text: s.label }); if (s.name === logName) o.selected = true; return o; }));
  const pre = h("pre", { class: "log" });
  let stick = true;
  pre.addEventListener("scroll", () => { stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20; });
  main.append(h("div", { class: "row" }, sel,
    h("button", { class: "btn", onclick: async () => { try { await navigator.clipboard.writeText(pre.textContent); toast("Copied"); } catch (e) { toast("Couldn't copy", true); } } }, "Copy"),
    h("button", { class: "btn", onclick: () => act(() => post("open", { kind: "logs" })) }, "Open Log Folder"),
    h("button", { class: "btn danger", onclick: async () => {
      if (!confirm("Clear this log? The file is emptied and can't be recovered.")) return;
      try { await post("log/clear?name=" + encodeURIComponent(logName)); toast("Cleared"); } catch (e) { toast(e.message, true); }
      load();
    } }, "Clear…")), pre);
  async function load() {
    if (r !== render || document.hidden) return;
    let d;
    try { d = await get("log?name=" + encodeURIComponent(logName) + "&lines=3000"); } catch (e) { return; }
    if (r !== render) return;
    const frag = document.createDocumentFragment();
    for (const line of d.text.split("\n")) {
      const cls = /\b(ERROR|CRITICAL|failed|error)\b/.test(line) ? "err" : /\b(WARN|NOTICE|warning)\b/.test(line) ? "warn" : "";
      frag.append(h("div", { class: cls, text: line || " " }));
    }
    pre.replaceChildren(frag);
    if (stick) pre.scrollTop = pre.scrollHeight;
  }
  load();
  timers.push(setInterval(load, 2000));
}

// ---- start

window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id !== section && SECTIONS.some(s => s[0] === id)) go(id); });
(async () => {
  try { S = await get("state"); } catch (e) { banner(e.message); return; }
  const id = location.hash.slice(1);
  go(SECTIONS.some(s => s[0] === id) ? id : "folders");
  // The tray asks an open window to switch pages (for example About OpenCloud Bar).
  setInterval(async () => {
    if (document.hidden) return;
    try { const g = await get("goto"); if (g.section && SECTIONS.some(s => s[0] === g.section)) go(g.section); } catch (e) { /* ignore */ }
  }, 2000);
})();
