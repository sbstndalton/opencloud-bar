# Builds installers for macOS, Windows and Linux and attaches them to the release for a v* tag.
#   macOS:   OpenCloud-Bar-macOS.dmg        (rclone inside the app)
#   Windows: OpenCloud-Bar-Setup-<v>.exe    (rclone, WinFsp, Start menu, start at sign-in, CLI on PATH)
#   Linux:   .deb / .rpm (rclone included, depends on fuse3 + ssh) and a .tar.gz
#
# Windows executables are signed through SignPath when it is set up
# (free code signing for open source; certificate by SignPath Foundation):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG (opencloud-bar), SIGNPATH_POLICY_SLUG (release-signing)
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cross/go.mod
          cache-dependency-path: cross/go.sum

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        working-directory: cross
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon ..\packaging\icon\icon.ico `
            --product-name "OpenCloud Bar" --file-description "OpenCloud Bar" `
            --product-version "${{ steps.ver.outputs.version }}" --file-version "${{ steps.ver.outputs.version }}" `
            --copyright "Copyright (c) 2026 Sebastian Dalton, MIT License"
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "..\dist\OpenCloud Bar.exe" .
          go build -trimpath -ldflags "-s -w" -o ..\dist\opencloud-bar.exe .

      - name: Upload unsigned
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/*.exe

      - name: Sign with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'opencloud-bar' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signed

      - name: Use signed files
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          Get-ChildItem signed\*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "{0}: {1} ({2})" -f $_.Name, $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { exit 1 }
          }
          Copy-Item signed\*.exe dist\ -Force

      - name: Gather rclone and WinFsp
        shell: bash
        run: |
          ./scripts/fetch-rclone.sh windows amd64 dist
          gh release download -R winfsp/winfsp --pattern '*.msi' --dir "$RUNNER_TEMP/winfsp"
          cp "$RUNNER_TEMP"/winfsp/*.msi dist/winfsp.msi
          cp LICENSE dist/LICENSE.txt

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSrc=$PWD\dist" packaging\windows\opencloud-bar.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\out

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/out/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cross/go.mod
          cache-dependency-path: cross/go.sum
      - name: Build
        run: |
          v=0.0.0; [[ "$GITHUB_REF" == refs/tags/v* ]] && v=${GITHUB_REF_NAME#v}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          mkdir -p dist
          for arch in amd64 arm64; do
            d="stage/opencloud-bar-linux-$arch"
            mkdir -p "$d"
            (cd cross && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "../$d/opencloud-bar" .)
            ./scripts/fetch-rclone.sh linux $arch "$d"
            cp LICENSE README.md "$d/"
            cp packaging/linux/opencloud-bar.desktop packaging/linux/opencloud-bar.service "$d/"
            cp packaging/icon/icon-256.png "$d/opencloud-bar.png"
            tar -C stage -czf "dist/opencloud-bar-linux-$arch.tar.gz" "opencloud-bar-linux-$arch"
            for fmt in deb rpm; do
              VERSION=$v ARCH=$arch SRC="$PWD/$d" envsubst < packaging/linux/nfpm.yaml > "$RUNNER_TEMP/nfpm.yaml"
              nfpm package -p $fmt -f "$RUNNER_TEMP/nfpm.yaml" -t dist/
            done
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: |
          ./scripts/build-dmg.sh
          mkdir -p dist
          cp build/OpenCloud-Bar.dmg dist/OpenCloud-Bar-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
